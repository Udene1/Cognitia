name: experience-evidence-boundary

on:
  push:
    branches: [main]
  pull_request:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run evidence-boundary experiment
        run: python tests/ci/experience_evidence_boundary.py
      - name: Upload research record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-evidence-boundary
          path: .ci/experience-evidence-boundary.json
          if-no-files-found: error
