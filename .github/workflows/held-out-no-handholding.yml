name: Held-out No-Handholding Research

on:
  pull_request:
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e .
      - name: Run held-out experiment
        run: python tests/ci/held_out_no_handholding_research.py
      - name: Upload research record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: held-out-no-handholding-research
          path: .ci/held-out-no-handholding-research.json
