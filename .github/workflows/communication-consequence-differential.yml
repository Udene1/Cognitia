name: communication-consequence-differential

on:
  pull_request:
    paths:
      - "tests/ci/communication_consequence_differential.py"
      - "cognitia/**"
      - ".github/workflows/communication-consequence-differential.yml"
      - "RESEARCH_COMMUNICATION_CONSEQUENCE_DIFFERENTIAL.md"
  push:
    branches:
      - main

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run differential consequence experiment
        run: python tests/ci/communication_consequence_differential.py
      - name: Record research artifact
        uses: actions/upload-artifact@v4
        with:
          name: communication-consequence-differential
          path: .ci/communication-consequence-differential.json
