name: differential-research-trajectory

on:
  push:
    branches: [main]
  pull_request:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run differential trajectory experiment
        run: python tests/ci/differential_trajectory.py
      - name: Upload differential trajectory record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-research-trajectory
          path: .ci/differential-trajectory.json
          if-no-files-found: error
