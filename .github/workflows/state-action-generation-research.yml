name: state-action-generation-research

on:
  push:
    branches: [main]
  pull_request:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run state-action generation experiment
        run: python tests/ci/state_action_generation_research.py
      - name: Upload research record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-action-generation-research
          path: .ci/state-action-generation-research.json
          if-no-files-found: error
