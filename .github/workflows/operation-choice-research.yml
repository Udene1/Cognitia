name: Operation Choice Research

on:
  push:
    branches: [main]
  pull_request:

jobs:
  operation-choice-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run operation-choice experiment
        run: python tests/ci/operation-choice_research.py
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: operation-choice-research
          path: .ci/operation-choice-research.json
