name: development-episode-reconstruction

on:
  pull_request:
    paths:
      - 'cognitia/development_episode.py'
      - 'tests/test_development_episode.py'
      - 'tests/ci/development_episode_reconstruction.py'
      - '.github/workflows/development-episode.yml'
  push:
    branches: [main]
    paths:
      - 'cognitia/development_episode.py'
      - 'tests/test_development_episode.py'
      - 'tests/ci/development_episode_reconstruction.py'
      - '.github/workflows/development-episode.yml'

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_development_episode.py -q
      - name: Run development episode experiment
        run: python tests/ci/development_episode_reconstruction.py
