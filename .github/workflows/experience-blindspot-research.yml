name: experience-blindspot-research

on:
  push:
    branches: [main]
  pull_request:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run experience blindspot experiment
        run: python tests/ci/experience_blindspot_research.py
      - name: Upload research record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-blindspot-research
          path: .ci/experience-blindspot-research.json
          if-no-files-found: error

  experience-conditioned-behavior-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run held-out experience behavior experiment
        run: python tests/ci/experience_conditioned_behavior_v2.py
      - name: Upload v2 research record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-conditioned-behavior-v2
          path: .ci/experience-conditioned-behavior-v2.json
          if-no-files-found: error
