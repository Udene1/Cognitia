name: communication-provenance

on:
  pull_request:
    paths:
      - "cognitia/communication_provenance.py"
      - "tests/test_communication_provenance.py"
      - ".github/workflows/communication-provenance.yml"
      - "RESEARCH_COMMUNICATION_PROVENANCE.md"
  push:
    branches:
      - main

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Run communication provenance tests
        run: python -m pytest -q tests/test_communication_provenance.py
