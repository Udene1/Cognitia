name: environment-evidence-conflict

on:
  push:
    paths:
      - "tests/ci/environment_evidence_conflict.py"
      - ".github/workflows/environment-evidence-conflict.yml"
      - "cognitia/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "tests/ci/environment_evidence_conflict.py"
      - ".github/workflows/environment-evidence-conflict.yml"
      - "cognitia/**"
      - "pyproject.toml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run environment evidence conflict experiment
        run: python tests/ci/environment_evidence_conflict.py
      - name: Record research artifact
        uses: actions/upload-artifact@v4
        with:
          name: environment-evidence-conflict
          path: .ci/environment-evidence-conflict.json
          if-no-files-found: error
