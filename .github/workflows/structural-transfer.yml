name: structural-transfer

on:
  pull_request:
  workflow_dispatch:

jobs:
  capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Exercise structural transfer and answer sufficiency
        run: python tests/ci/structural_transfer.py
      - name: Exercise historical temporal semantics
        run: python tests/ci/temporal_marker_regression.py
      - name: Exercise semantic polarity and cognitive preservation
        run: python tests/ci/semantic_polarity.py
