name: live-web-research

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  live-web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Acquire unscripted web observations
        run: python tests/ci/live_web_access.py
      - name: Search and fetch real source documents
        run: python tests/ci/live_web_research.py
      - name: Run open-ended research experiment on live web
        run: python tests/ci/live_open_ended_research.py
      - name: Prove live research crosses the durable-memory boundary
        run: python tests/ci/live_research_memory_loop.py
      - name: Run open-ended research through answer construction
        run: python tests/ci/live_open_ended_answer.py
      - name: Run Roman Empire complete cognition trace and revision
        run: python tests/ci/roman_empire_trace.py
      - name: Upload Roman Empire cognition trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-empire-cognition-trace
          path: .ci/roman-empire-trace.json
