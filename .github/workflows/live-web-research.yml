name: live-web-research

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  live-web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Acquire unscripted web observations
        run: python tests/ci/live_web_access.py
