name: action-space-reduction-research

on:
  push:
    branches: [main]
  pull_request:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run action-space reduction experiment
        run: python tests/ci/action-space-reduction_research.py
      - name: Upload research record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-space-reduction-research
          path: .ci/action-space-reduction-research.json
          if-no-files-found: error
