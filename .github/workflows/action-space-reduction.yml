name: action-space-reduction-research

on:
  push:
    branches: [main]
  pull_request:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run action-space reduction experiment
        run: python tests/ci/action-space-reduction_research.py
      - name: Upload research record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-space-reduction-research
          path: .ci/action-space-reduction-research.json
          if-no-files-found: error

  induced-experience-abstraction-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run induced experience abstraction v2
        run: python tests/ci/induced_experience_abstraction_v2.py
      - name: Upload induced abstraction v2 record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: induced-experience-abstraction-v2
          path: .ci/induced-experience-abstraction-v2.json
          if-no-files-found: error
