name: communication-consequence-evidence-integration

on:
  pull_request:
    paths:
      - "tests/ci/communication_consequence_evidence_integration.py"
      - "cognitia/**"
      - ".github/workflows/communication-consequence-evidence-integration.yml"
      - "RESEARCH_COMMUNICATION_CONSEQUENCE_EVIDENCE_INTEGRATION.md"
  push:
    branches:
      - main

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run evidence integration experiment
        run: python tests/ci/communication_consequence_evidence_integration.py
      - name: Record research artifact
        uses: actions/upload-artifact@v4
        with:
          name: communication-consequence-evidence-integration
          path: .ci/communication-consequence-evidence-integration.json
