name: cognitive-ingestion-persistence-audit

on:
  push:
    branches: [main]
    paths:
      - "cognitia/**"
      - "tests/ci/cognitive_ingestion_persistence_audit.py"
      - ".github/workflows/cognitive-ingestion-persistence-audit.yml"
  pull_request:
    paths:
      - "cognitia/**"
      - "tests/ci/cognitive_ingestion_persistence_audit.py"
      - ".github/workflows/cognitive-ingestion-persistence-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Audit actual ingestion and persistence
        run: python tests/ci/cognitive_ingestion_persistence_audit.py
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-ingestion-persistence-audit
          path: .ci/cognitive-ingestion-persistence-audit.json
          if-no-files-found: error
