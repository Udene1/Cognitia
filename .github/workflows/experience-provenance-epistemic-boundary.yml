name: experience-provenance-epistemic-boundary-research

on:
  push:
    branches: [main]
  pull_request:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run held-out provenance experiment
        run: python tests/ci/experience-provenance-epistemic-boundary.py
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-provenance-epistemic-boundary
          path: .ci/experience-provenance-epistemic-boundary.json
          if-no-files-found: error
