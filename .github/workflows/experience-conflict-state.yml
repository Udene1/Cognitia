name: experience-conflict-state

on:
  pull_request:
    paths:
      - "tests/ci/experience_conflict_state.py"
      - ".github/workflows/experience-conflict-state.yml"
      - "cognitia/**"
      - "pyproject.toml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run conflict-state experiment
        run: python tests/ci/experience_conflict_state.py
      - name: Record research artifact
        uses: actions/upload-artifact@v4
        with:
          name: experience-conflict-state
          path: .ci/experience-conflict-state.json
          if-no-files-found: error
