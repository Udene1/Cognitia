name: experience-downstream-consequence

on:
  push:
    branches: [research/experience-downstream-consequence]
  pull_request:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run downstream consequence experiment
        run: python tests/ci/experience_downstream_consequence.py
      - name: Upload research record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-downstream-consequence
          path: .ci/experience-downstream-consequence.json
          if-no-files-found: error
