name: live-research-memory

on:
  push:
    branches: [main]
    paths:
      - "cognitia/open_research.py"
      - "cognitia/knowledge/validated.py"
      - "cognitia/research_synthesis.py"
      - "tests/ci/live_research_memory_loop.py"
      - ".github/workflows/live-research-memory.yml"
  pull_request:
    paths:
      - "cognitia/open_research.py"
      - "cognitia/knowledge/validated.py"
      - "cognitia/research_synthesis.py"
      - "tests/ci/live_research_memory_loop.py"
      - ".github/workflows/live-research-memory.yml"
  workflow_dispatch:

jobs:
  verify-memory-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Verify live research crosses the durable-memory boundary
        run: python tests/ci/live_research_memory_loop.py
