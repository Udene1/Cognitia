name: Adaptive Research Strategy

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Cognitia
        run: python -m pip install -e .
      - name: Prove bounded multi-query strategy
        run: python tests/ci/adaptive_search_strategy.py
