name: communication-consequence-temporal-evidence

on:
  pull_request:
    paths:
      - "tests/ci/communication_consequence_temporal_evidence.py"
      - "cognitia/**"
      - ".github/workflows/communication-consequence-temporal-evidence.yml"
      - "RESEARCH_COMMUNICATION_CONSEQUENCE_TEMPORAL_EVIDENCE.md"
  push:
    branches:
      - main

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run temporal evidence experiment
        run: python tests/ci/communication_consequence_temporal_evidence.py
      - name: Record research artifact
        uses: actions/upload-artifact@v4
        with:
          name: communication-consequence-temporal-evidence
          path: .ci/communication-consequence-temporal-evidence.json
