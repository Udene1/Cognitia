name: Relational Binding Experience

on:
  pull_request:
    paths:
      - 'cognitia/experience_decision.py'
      - 'cognitia/structural_experience.py'
      - 'cognitia/language/**'
      - 'tests/test_structural_experience_binding.py'
      - 'tests/ci/relational_binding_experience.py'
      - '.github/workflows/relational-binding-experience.yml'

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run relational binding experiment
        run: python tests/ci/relational_binding_experience.py
      - name: Run focused binding tests
        run: pytest tests/test_structural_experience_binding.py tests/test_language_representation_invariance.py
      - name: Upload research record
        uses: actions/upload-artifact@v4
        with:
          name: relational-binding-experience
          path: .ci/relational-binding-experience.json
