name: zero-handholding-communication

on:
  pull_request:
    paths:
      - 'cognitia/**'
      - 'tests/ci/zero_handholding_communication.py'
      - '.github/workflows/zero-handholding-communication.yml'

jobs:
  exposure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Run zero-handholding exposure
        run: python tests/ci/zero_handholding_communication.py
      - name: Record research artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-handholding-communication-exposure
          path: .ci/zero-handholding-communication-exposure.json
