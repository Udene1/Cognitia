name: communication-independent-consequence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run independent consequence experiment
        run: python tests/ci/communication_independent_consequence.py
      - name: Record research artifact
        uses: actions/upload-artifact@v4
        with:
          name: communication-independent-consequence
          path: .ci/communication-independent-consequence.json
