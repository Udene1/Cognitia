name: live-web-research

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  live-web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Cognitia
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Search the real public internet
        env:
          COGNITIA_LIVE_WEB: "1"
        run: python tests/ci/live_web_search.py
