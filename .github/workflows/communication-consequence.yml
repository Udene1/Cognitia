name: communication-consequence

on:
  pull_request:
    paths:
      - 'cognitia/**'
      - 'tests/ci/communication_consequence.py'
      - '.github/workflows/communication-consequence.yml'

jobs:
  exposure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Run consequence exposure
        run: python tests/ci/communication_consequence.py
      - name: Record research artifact
        uses: actions/upload-artifact@v4
        with:
          name: communication-consequence-exposure
          path: .ci/communication-consequence-exposure.json
