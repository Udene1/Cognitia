name: no-handholding-v2

on:
  pull_request:
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Run no-handholding v2 experiment
        run: python tests/ci/no_handholding_v2.py
      - name: Upload research record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: held-out-no-handholding-v2
          path: .ci/held-out-no-handholding-v2.json
          if-no-files-found: error
