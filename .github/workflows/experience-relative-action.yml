name: experience-relative-action
on:
  push:
    branches: [research/experience-relative-action]
  pull_request:
jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run experiment
        run: python tests/ci/experience_relative_action.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-relative-action
          path: .ci/experience-relative-action.json
          if-no-files-found: error
